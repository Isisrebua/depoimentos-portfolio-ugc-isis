<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deixe seu depoimento — Isis Rebuá UGC</title>
<!--
  Página pública independente — não faz parte do index.html. Link pra
  compartilhar com marcas/clientes depois de fechar um trabalho, pra
  coletar depoimento. Envia pra POST /api/depoimentos (server.js), que
  salva em depoimentos.json com status "pendente". Só aparece no
  portfólio depois que Isis aprovar na aba "Depoimentos" do
  banco-de-leads.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: "Poppins", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(191,207,204,.6), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(166,70,4,.12), transparent 45%),
      #ECEBE6;
    color: #333;
  }
  .card{
    width: 100%;
    max-width: 520px;
    background: #FDFBF7;
    border-radius: 28px;
    padding: 36px 32px 30px;
    box-shadow: 0 32px 64px -16px rgba(28,50,50,.28), 0 12px 24px -12px rgba(0,0,0,.16);
  }
  .card__brand{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .card__brand-dot{ width: 10px; height: 10px; border-radius: 50%; background: #bfcfcc; }
  .card__brand span{ font-size: .78rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: #7c8a6f; }
  h1{
    margin: 0 0 8px;
    font-family: "Baloo 2", "Poppins", sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    color: #333;
  }
  .lead{ margin: 0 0 26px; font-size: .92rem; color: #6b6b6b; line-height: 1.55; }

  form{ display: flex; flex-direction: column; gap: 14px; }
  .field{ display: flex; flex-direction: column; gap: 5px; }
  .field label{ font-weight: 600; font-size: .82rem; color: #333; }
  .field small{ font-weight: 400; color: #8a8a8a; font-size: .75rem; }
  .field input,
  .field textarea{
    font-family: inherit;
    font-size: .92rem;
    color: #333;
    background: #fff;
    border: 1px solid rgba(0,0,0,.14);
    border-radius: 10px;
    padding: 10px 12px;
    resize: vertical;
  }
  .field input:focus,
  .field textarea:focus{
    outline: none;
    border-color: #a64604;
    box-shadow: 0 0 0 3px rgba(166,70,4,.15);
  }
  .field input[type="file"]{
    padding: 8px 10px;
    font-size: .85rem;
    background: #fff;
    cursor: pointer;
  }
  .field-hint{ font-size: .72rem; color: #9a9a9a; }

  /* ---------- Seletor de estrelas (1 a 5) ----------
     5 <label> com <input type="radio"> escondido — clicável, navegável
     por teclado, funciona sem nenhum JS (o JS só faz o preenchimento
     visual reagir ao hover/seleção). */
  .stars{
    display: flex;
    flex-direction: row-reverse;
    justify-content: flex-end;
    gap: 4px;
  }
  .stars input{
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }
  .stars label{
    font-size: 1.9rem;
    line-height: 1;
    color: #d9d9d9;
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
  }
  .stars label:hover,
  .stars label:hover ~ label{ color: #f0b429; transform: scale(1.08); }
  .stars input:checked ~ label{ color: #f0b429; }

  .submit-btn{
    margin-top: 6px;
    border: none;
    background: linear-gradient(135deg, #98ab80, #a64604);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: .95rem;
    padding: 14px 24px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px -8px rgba(0,0,0,.3);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .submit-btn:hover{ transform: translateY(-2px); box-shadow: 0 10px 20px -8px rgba(166,70,4,.4); }
  .submit-btn:disabled{ opacity: .6; cursor: default; transform: none; }

  .success{
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 0 6px;
    text-align: center;
  }
  .success.is-visible{ display: flex; }
  .success svg{ width: 52px; height: 52px; color: #9FAF90; }
  .success p{ margin: 0; font-weight: 600; color: #333; }
  form.is-hidden{ display: none; }

  @media (max-width: 480px){
    .card{ padding: 28px 22px 24px; border-radius: 22px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card__brand">
    <span class="card__brand-dot"></span>
    <span>Isis Rebuá UGC</span>
  </div>
  <h1 data-i18n-skip>Deixe seu depoimento</h1>
  <p class="lead">Sua opinião ajuda outras marcas a conhecerem meu trabalho. Leva menos de 2 minutos — obrigada! 💛</p>

  <form id="depoimento-form">
    <div class="field">
      <label for="dep-name">Nome do responsável</label>
      <input type="text" id="dep-name" name="responsibleName" required autocomplete="name">
    </div>
    <div class="field">
      <label for="dep-company">Empresa / marca</label>
      <input type="text" id="dep-company" name="company" required autocomplete="organization">
    </div>
    <div class="field">
      <label>Nota</label>
      <div class="stars" id="dep-stars">
        <input type="radio" name="rating" id="star-5" value="5" checked><label for="star-5" title="5 estrelas">★</label>
        <input type="radio" name="rating" id="star-4" value="4"><label for="star-4" title="4 estrelas">★</label>
        <input type="radio" name="rating" id="star-3" value="3"><label for="star-3" title="3 estrelas">★</label>
        <input type="radio" name="rating" id="star-2" value="2"><label for="star-2" title="2 estrelas">★</label>
        <input type="radio" name="rating" id="star-1" value="1"><label for="star-1" title="1 estrela">★</label>
      </div>
    </div>
    <div class="field">
      <label for="dep-text">Seu depoimento</label>
      <textarea id="dep-text" name="text" rows="4" required placeholder="Conte como foi trabalhar com a Isis e o resultado que o conteúdo trouxe pra sua marca..."></textarea>
    </div>
    <div class="field">
      <label for="dep-logo">Logo ou foto de perfil da marca <small>(opcional)</small></label>
      <input type="file" id="dep-logo" name="logoFile" accept="image/*">
      <span class="field-hint">Imagem até 8&nbsp;MB.</span>
    </div>
    <div class="field">
      <label for="dep-video">Vídeo ou Print de resultados <small>(opcional)</small></label>
      <input type="file" id="dep-video" name="videoFile" accept="image/*,video/*">
      <span class="field-hint">Anexe um vídeo curto ou print de resultados (métricas, tráfego pago, dashboard).</span>
    </div>
    <button type="submit" class="submit-btn">Enviar depoimento</button>
  </form>

  <div class="success" id="dep-success">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    <p>Depoimento enviado! Muito obrigada pela confiança 💛</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var form = document.getElementById("depoimento-form");
  var success = document.getElementById("dep-success");
  var submitBtn = form.querySelector(".submit-btn");
  var logoInput = document.getElementById("dep-logo");
  var videoInput = document.getElementById("dep-video");

  var MAX_LOGO_MB = 8;
  var MAX_MEDIA_MB = 15; // segundo campo aceita imagem OU vídeo — mesmo teto pros dois

  // Lê um <input type="file"> como data URI base64 — é assim que o
  // arquivo vira texto pra caber num JSON comum (server.js não tem
  // parser de multipart/form-data; o server decodifica esse base64 e
  // grava o arquivo de verdade na pasta uploads/, ver server.js).
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (typeof form.reportValidity === "function" && !form.reportValidity()) return;

    var logoFile = logoInput.files[0] || null;
    var videoFile = videoInput.files[0] || null;

    if (logoFile && logoFile.size > MAX_LOGO_MB * 1024 * 1024) {
      alert("A imagem do logo/foto está muito grande (máximo " + MAX_LOGO_MB + " MB).");
      return;
    }
    if (videoFile && videoFile.size > MAX_MEDIA_MB * 1024 * 1024) {
      alert("O arquivo está muito grande (máximo " + MAX_MEDIA_MB + " MB). Tente comprimir o vídeo ou usar uma imagem menor.");
      return;
    }

    var data = Object.fromEntries(new FormData(form).entries());
    delete data.logoFile; // esses dois vieram do FormData como File objects — substituídos abaixo pelo base64 real
    delete data.videoFile;

    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando…";

    Promise.all([
      logoFile ? fileToBase64(logoFile) : Promise.resolve(null),
      videoFile ? fileToBase64(videoFile) : Promise.resolve(null),
    ])
      .then(function (results) {
        if (results[0]) data.logoFile = results[0];
        if (results[1]) data.videoFile = results[1];

        return fetch("/api/depoimentos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
      })
      .then(function (res) {
        if (!res.ok) throw new Error("Falha ao enviar");
        form.classList.add("is-hidden");
        success.classList.add("is-visible");
      })
      .catch(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "Enviar depoimento";
        alert("Não foi possível enviar agora. Confira sua conexão e tente de novo.");
      });
  });
})();
</script>
</body>
</html>
